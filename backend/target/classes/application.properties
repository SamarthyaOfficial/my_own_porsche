# Server Configuration
server.port=8081

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:porschedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=porsche-clone-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# Google OAuth2 Configuration (replace with your credentials)
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.porsche=DEBUG
